<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>FPL Kiwi - FPL Projections</title>

    <meta name="description" content="FPL predictions from The FPL Kiwi" />
    <meta name="keywords" content="fantasy sports, FPL, premier league, football, projections, betting" />
    <meta name="author" content="The FPL Kiwi (@theFPLkiwi)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="https://cdn.datatables.net/v/bs4/dt-1.10.23/b-1.6.5/b-colvis-1.6.5/b-html5-1.6.5/fc-3.3.2/fh-3.1.7/r-2.2.6/sp-1.2.2/datatables.min.css" />
    <script src="https://d3js.org/d3.v6.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3-interpolate/1.3.0/d3-interpolate.js" integrity="sha512-KcUKnCgVgjA6pyyyN33d5S1IHk9hFUaldkL8BmKvqR+7q9HyZj3jmWJemF6IJuLkcj3biCNzdGgXNPJCjurXnQ==" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.1/js/fontawesome.min.js" integrity="sha256-TMRxGf3NaZhrxTfD8y/NGiyE4UXBA3udH1l+Co8JDVU=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@5.15.1/css/all.min.css" integrity="sha256-rx5u3IdaOCszi7Jb18XD9HSn8bNiEgAqWJbdBvIYYyU=" crossorigin="anonymous">
    <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>

    <header>
        <nav class="navbar navbar-dark kiwi-nav">
            <div class="container d-flex justify-content-between">
                <img src="./static/img/icon.jpg" class="rounded" height="30" />
                <a class="navbar-brand mb-0 h1 title-text" href="index.html">The FPL Kiwi - FPL Projections</a>
                <a class="title-text nav-link-kiwi" href="https://twitter.com/theFPLkiwi" target="_blank">Twitter</a>
            </div>
        </nav>
    </header>

    <main>

        <div class="container updated-line" id="updatedLine"></div>

        <div class="container" id="loading">
            <div class="d-flex justify-content-center my-4">Loading data...</div>
        </div>

        <div class="container controls" id="controls" style="display: none">
            <div class="control-row">
                <div class="form-group">
                    <label for="horizonSelect">Show horizon</label>
                    <select class="form-control form-control-sm" id="horizonSelect">
                        <option value="1">1</option>
                        <option value="5">5</option>
                        <option value="10">10</option>
                        <option value="99" selected>All</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="headerSelect">Header style</label>
                    <select class="form-control form-control-sm" id="headerSelect">
                        <option value="false" selected>Original</option>
                        <option value="true">No Space</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="decayInput">Decay per GW*</label>
                    <input type="number" class="form-control form-control-sm" id="decayInput"
                           value="1" min="0.01" max="1" step="0.01">
                </div>
                <div class="form-group toggle-group">
                    <button type="button" class="btn btn-sm btn-toggle" id="toggleFilters"
                            aria-controls="filterPanel" aria-expanded="false">Show filters</button>
                    <button type="button" class="btn btn-sm btn-toggle" id="toggleMinMax"
                            aria-expanded="false">Show min/max</button>
                </div>
            </div>
            <div id="filterPanel">
                <div class="chip-row">
                    <span class="chip-label">Positions</span>
                    <div class="chip-flow">
                        <div id="posChips" class="chips"></div>
                        <button type="button" class="chip-all" data-all="pos" data-on="1">All</button>
                        <button type="button" class="chip-all" data-all="pos" data-on="0">None</button>
                    </div>
                </div>
                <div class="chip-row">
                    <span class="chip-label">Teams</span>
                    <div class="chip-flow">
                        <div id="teamChips" class="chips"></div>
                        <button type="button" class="chip-all" data-all="team" data-on="1">All</button>
                        <button type="button" class="chip-all" data-all="team" data-on="0">None</button>
                    </div>
                </div>
                <div class="panel-row">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="cheapestCheck">
                        <label class="form-check-label" for="cheapestCheck">Cheapest per position only</label>
                    </div>
                    <button type="button" class="btn btn-sm btn-outline-kiwi" id="resetFilters">Reset filters</button>
                </div>
            </div>
        </div>

        <div class="container" id="tableArea" style="display: none">
            <table class="table table-sm text-small text-center mt-2" id="proj_table"></table>
            <div class="d-flex justify-content-center mb-3" id="buttons"></div>
        </div>

    </main>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.js" integrity="sha512-WNLxfP/8cVYL9sj8Jnp6et0BkubLP31jhTG9vhL/F5uEZmg5wEzKoXp1kJslzPQWwPT1eyMiSxlKCgzHLOTOTQ==" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/lodash@4.17.20/lodash.min.js" integrity="sha256-ur/YlHMU96MxHEsy3fHGszZHas7NzH4RQlD4tDVvFhw=" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://cdn.datatables.net/v/bs4/dt-1.10.23/b-1.6.5/b-colvis-1.6.5/b-html5-1.6.5/fc-3.3.2/fh-3.1.7/r-2.2.6/sp-1.2.2/datatables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-csv/1.0.21/jquery.csv.js" integrity="sha512-2ypsPur7qcA+2JjmmIJR1c4GWFqTLIe1naXXplraMg0aWyTOyAMpOk+QL+ULpzwrO/GdwA3qB3FhVyyiR8gdhw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="static/js/index.js"></script>

</body>
</html>
